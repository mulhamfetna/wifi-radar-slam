name: tests
on:
  push:
    branches: [main, consolidation]
  pull_request:
    branches: [main, consolidation]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Sionna (the 'sim' extra) is heavy + GPU-oriented; the Sionna tests importorskip.
      # The WiFiSLAM-Sim .npz is a release asset, not a repo file, so the sensitivity tests
      # skip here too. CI installs the pure-NumPy/sklearn deps: 199 pass, 11 skip.
      # Locally, with the dataset present: 206 pass, 4 skip.
      - run: pip install -e '.[ml,dev]'
      - run: python -m pytest -q
